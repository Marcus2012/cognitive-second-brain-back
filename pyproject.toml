[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-second-brain"
version = "0.1.0"
description = "Independent knowledge and project execution platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<3", "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3",
  "pydantic[email]>=2.10,<3", "PyJWT>=2.10,<3", "pwdlib[argon2]>=0.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
