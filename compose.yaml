services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: brain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: brain
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U brain -d brain"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    environment: &environment
      BRAIN_ENVIRONMENT: production
      BRAIN_DATABASE_URL: postgresql+psycopg://brain:${POSTGRES_PASSWORD}@db:5432/brain
      BRAIN_JWT_SECRET: ${BRAIN_JWT_SECRET:?Set BRAIN_JWT_SECRET}
      BRAIN_CORS_ORIGINS: ${BRAIN_CORS_ORIGINS:-["http://localhost:3000"]}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  api:
    build: .
    environment: *environment
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
volumes:
  postgres_data:
